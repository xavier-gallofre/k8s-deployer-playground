apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: api-rollout-ab
  namespace: demo
  labels:
    app: api-ab
    strategy: ab-testing
spec:
  replicas: 4
  selector:
    matchLabels:
      app: api-ab
  template:
    metadata:
      labels:
        app: api-ab
    spec:
      containers:
      - name: api
        image: hashicorp/http-echo:0.2.3
        args:
        - "-listen=:8081"
        - "-text=API A/B testing - Hello from microservices demo"
        ports:
        - containerPort: 8081
        env:
        - name: VERSION
          value: "ab-testing"
        resources:
          requests:
            cpu: 50m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 64Mi
  strategy:
    canary:
      canaryService: api-ab-canary
      stableService: api-ab-stable
      trafficRouting:
        istio:
          virtualServices:
          - name: api-ab-vsvc
            routes:
            - primary
      analysis:
        templates:
        - templateName: success-rate
        startingStep: 2
        args:
        - name: service-name
          value: api-ab-canary.demo.svc.cluster.local
      steps:
      - setWeight: 20
      - pause: {duration: 5m}
      - setWeight: 50
      - pause: {duration: 5m}
      - setWeight: 100
---
apiVersion: v1
kind: Service
metadata:
  name: api-ab-stable
  namespace: demo
spec:
  selector:
    app: api-ab
  ports:
  - port: 8081
    targetPort: 8081
---
apiVersion: v1
kind: Service
metadata:
  name: api-ab-canary
  namespace: demo
spec:
  selector:
    app: api-ab
  ports:
  - port: 8081
    targetPort: 8081
