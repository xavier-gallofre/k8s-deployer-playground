apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: api-rollout-bluegreen
  namespace: demo
  labels:
    app: api
    strategy: bluegreen
spec:
  replicas: 4
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
      - name: api
        image: hashicorp/http-echo:0.2.3
        args:
        - "-listen=:8081"
        - "-text=API blue/green - Hello from microservices demo"
        ports:
        - containerPort: 8081
        env:
        - name: VERSION
          value: "bluegreen"
        resources:
          requests:
            cpu: 50m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 64Mi
  strategy:
    blueGreen:
      activeService: api-active
      previewService: api-preview
      autoPromotionEnabled: false
      prePromotionAnalysis:
        templates:
        - templateName: smoke-test
      postPromotionAnalysis:
        templates:
        - templateName: success-rate
---
apiVersion: v1
kind: Service
metadata:
  name: api-active
  namespace: demo
spec:
  selector:
    app: api
  ports:
  - port: 8081
    targetPort: 8081
---
apiVersion: v1
kind: Service
metadata:
  name: api-preview
  namespace: demo
spec:
  selector:
    app: api
  ports:
  - port: 8081
    targetPort: 8081
---
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: smoke-test
  namespace: demo
spec:
  args:
  - name: service-name
  metrics:
  - name: smoke-test
    interval: 10s
    count: 3
    successCondition: result[0] == 200
    provider:
      http:
        url: "http://{{args.service-name}}:8081"
        timeoutSeconds: 5
        insecure: true
