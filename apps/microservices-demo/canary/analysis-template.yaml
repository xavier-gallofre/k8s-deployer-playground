apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: success-rate
  namespace: demo
spec:
  args:
  - name: service-name
  metrics:
  - name: success-rate
    interval: 30s
    count: 5
    successCondition: result[0] >= 0.95
    provider:
      prometheus:
        address: http://prometheus.istio-system.svc.cluster.local:9090
        query: |
          sum(rate(http_requests_total{service="{{args.service-name}}",code=~"2.*"}[1m]))
          /
          sum(rate(http_requests_total{service="{{args.service-name}}"}[1m]))
  - name: latency-p99
    interval: 30s
    count: 5
    successCondition: result[0] <= 500
    provider:
      prometheus:
        address: http://prometheus.istio-system.svc.cluster.local:9090
        query: |
          histogram_quantile(0.99, sum(rate(http_request_duration_milliseconds_bucket{service="{{args.service-name}}"}[1m])) by (le))
